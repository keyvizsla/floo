name: "Testing in fixed environment"

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write
  pages: write
  id-token: write
  packages: write 

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/test-env

jobs:
  # JOB 1: Handles the Main Branch (Builds and pushes securely to GHCR)
  publish_and_test_main:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: test/images/linux/Dockerfile
          push: true
          tags: format('ghcr.io/{0}:latest', env.IMAGE_NAME)
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run Unittests
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/app \
            -w /app \
            ghcr.io/${{ env.IMAGE_NAME }}:latest

  # JOB 2: Handles Feature Branches & PRs (Builds locally and tests locally on the SAME machine)
  test_feature_branch_locally:
    if: github.ref != 'refs/heads/main' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image locally
        uses: docker/build-push-action@v5
        with:
          context: .
          file: test/images/linux/Dockerfile
          push: false
          load: true 
          tags: local-test-env:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run Unittests
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/app \
            -w /app \
            local-test-env:latest

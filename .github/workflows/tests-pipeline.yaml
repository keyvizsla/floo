name: "Testing in fixed environment"

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write
  pages: write
  id-token: write
  packages: write 

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/test-env

jobs:
  build_docker_env:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && format('ghcr.io/{0}:latest', env.IMAGE_NAME) || 'local-test-env:latest' }}
      is_local: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/main') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.test
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          load: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/main') }}
          tags: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && format('ghcr.io/{0}:latest', env.IMAGE_NAME) || 'local-test-env:latest' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  run_tests:
    needs: build_docker_env
    uses: ./.github/workflows/run-tests.yaml
    with:
      image_tag: ${{ needs.build_docker_env.outputs.image_tag }}
      is_local: ${{ needs.build_docker_env.outputs.is_local == 'true' }}

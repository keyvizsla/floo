[package]
name = "floo"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "floo-bin"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
crossterm = "0.29.0"
ratatui = "0.30.0"
ratatui-interact = "0.5.3"
rusqlite = { version = "0.39.0", features = ["bundled"] }
tui-markdown = "0.3.7"

[package]
name = "floo"
version = "0.1.2"
edition = "2024"
description = "Effortless travel to and from workspaces"
documentation = "https://keyvizsla.github.io/floo"
readme = "README.md"
homepage = "https://keyvizsla.github.io/floo"
repository = "https://github.com/keyvizsla/floo"
license = "GPL-3.0"
keywords = ["developer-tools", "ratatui", "tui", "utility", "workspace"]
categories = [
  "command-line-interface",
  "command-line-utilities",
  "development-tools",
  "filesystem"
]

[[bin]]
name = "floo-bin"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
crossterm = "0.29.0"
directories = "6.0.0"
dotenvy = "0.15.7"
edit = "0.1.5"
ratatui = "0.30.0"
rusqlite = { version = "0.39.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.150"
shellexpand = "3.1.2"
tui-markdown = "0.3.7"

[dependencies.ratatui-interact]
package = "ratatui-interact-fork"
version = "0.5.3-fork.1"
features = ["filesystem", "markdown"]

[dependencies.reqwest]
version = "0.12"
default-features = false
features = ["blocking", "json", "rustls-tls"]

[dev-dependencies]
insta = "1.47.2"

[features]
bundled = ["rusqlite/bundled"]

# ============================================================================
# INTERNAL TESTING FEATURES
# WARNING: The features below are strictly for CI/CD and Docker testing 
# environments. Do not enable them in production or local development 
# unless you are replicating a specific GitHub Actions pipeline.
# ============================================================================
test-docker-linux-bash = []
